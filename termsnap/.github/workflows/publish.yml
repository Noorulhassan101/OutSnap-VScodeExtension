name: Publish TermSnap to VSCode Marketplace

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18.x

      - name: Install dependencies
        run: npm ci

      - name: Compile extension
        run: npm run compile

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18.x

      - name: Install dependencies
        run: npm ci

      - name: Publish to VSCode Marketplace
        uses: lannonbr/vsce-action@master
        with:
          args: "publish -p ${{ secrets.VSCE_PAT }}"
